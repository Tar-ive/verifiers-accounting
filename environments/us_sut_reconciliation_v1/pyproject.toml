[project]
name = "us-sut-reconciliation-v1"
version = "0.1.0"
description = "US state sales & use tax return reconciliation with injected bookkeeping faults (US analogue of au-bas-reconciliation-v1)."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["us_sut_reconciliation_v1"]

[dependency-groups]
dev = ["pytest"]
